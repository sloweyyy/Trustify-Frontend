name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # CRA turns lint warnings into errors when CI=true; existing warnings are tracked separately.
      - run: npm run build
        env:
          CI: false
          REACT_APP_API_BASE_URL: https://trustify-api-ar4i.onrender.com/v1
